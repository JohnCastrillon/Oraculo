<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Movimiento - Finanzas</title>
    <!-- Manifiesto PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F172A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="container">
        <a href="index.html" class="btn-back" style="display: inline-block; text-decoration: none;">← Volver al menú</a>
        <h2>Nuevo Movimiento</h2>

        <form id="gastoForm">
            <div class="form-group">
                <label>Categoría</label>
                <select id="categoria" required>
                    <option value="Salario/Nomina">Salario/Nomina</option>
                    <option value="Vivienda">Vivienda</option>
                    <option value="Servicios Publicos">Servicios Publicos</option>
                    <option value="Alimentacion/Mercado">Alimentacion/Mercado</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Deudas y Creditos">Deudas y Creditos</option>
                    <option value="Restaurantes y salidas">Restaurantes y salidas</option>
                    <option value="Entretenimiento y ocio">Entretenimiento y ocio</option>
                    <option value="Suscripciones y Streaming">Suscripciones y Streaming</option>
                    <option value="Compras Personales y Ropa">Compras Personales y Ropa</option>
                    <option value="Cuidado personal">Cuidado personal</option>
                    <option value="Regalos y Donaciones">Regalos y Donaciones</option>
                    <option value="Fondo de Ahorro e Inversión">Fondo de Ahorro e Inversión</option>
                    <option value="Ahorro Simone">Ahorro Simone</option>
                </select>
            </div>
            <div class="form-group">
                <label>Concepto</label>
                <input type="text" id="concepto" placeholder="Ej. Supermercado" required>
            </div>
            <div class="form-group">
                <label>Fecha</label>
                <input type="date" id="fecha" required>
            </div>
            <div class="form-group">
                <label>Importe ($)</label>
                <input type="number" step="0.01" id="importe" placeholder="0.00" required>
            </div>
            <button type="submit" id="btnEnviar" class="btn-action">Guardar en Google Sheets</button>
            <div id="mensaje"></div>
        </form>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
